  name: Build Android APK
  
  on:
    workflow_dispatch:
    push:
      branches: [ "main" ]
      paths:
        - 'Android/**'
        - '.github/workflows/build_android.yaml'
  
  jobs:
    build_apk:
      name: Build Android APK
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./Android/src
      steps:
        - name: Checkout the source code
          uses: actions/checkout@v3
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
        - name: Install Android SDK Platform 37
          run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
        - name: Build
          run: ./gradlew assembleRelease
        - name: List APKs
          run: ls -lh app/build/outputs/apk/release/ || find . -name "*.apk" -maxdepth 6
        - name: Upload APK artifact
          uses: actions/upload-artifact@v4
          with:
            name: Wiki-arm64-apk
            path: Android/src/app/build/outputs/apk/release/*.apk
            if-no-files-found: error
  
  
